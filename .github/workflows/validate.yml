name: validate

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Rules engine
        run: bun test

      - name: Shell rules
        run: bun run scripts/verify-shell.ts

      - name: Site rules
        run: bun run scripts/verify-site.ts

      - name: Install Stockfish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish

      - name: Puzzle answers
        run: bun run scripts/verify-drills.ts

  # The document standard, from the one checker in aivara-se/.github. This
  # repository carries no copy of it.
  docs:
    permissions:
      contents: read
    uses: aivara-se/.github/.github/workflows/validate-docs.yml@main
