name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Rules engine
        run: bun test

      - name: Shell rules
        run: bun run scripts/verify-shell.ts

      - name: Site rules
        run: bun run scripts/verify-site.ts

      - name: Install Stockfish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish

      - name: Puzzle answers
        run: bun run scripts/verify-drills.ts
