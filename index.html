<!doctype html>
<!--
  Learn chess — a beginner's course that behaves like a small phone app:
  a bottom tab bar, one idea per card, big tap targets, stars for progress.
  Everything is local: self-hosted fonts, no analytics, no third-party request,
  no build step. Rules and opponent: js/engine.js. Course: js/lessons.js.
  Interface: js/app.js.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3ff">
  <title>Learn chess</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="description" content="Learn chess the easy way: short lessons, puzzles you play yourself, and a friendly coach for your moves.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Learn chess">
  <meta property="og:description" content="Short lessons, puzzles you play, and a coach for your moves.">
  <style>
    /* Self-hosted, latin subset, variable weight. Both families are OFL 1.1
       (assets/fonts/OFL-*.txt). No CDN link: this app makes no third-party
       request by design. */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url(assets/fonts/inter-latin.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Space Grotesk';
      font-style: normal;
      font-weight: 500 700;
      font-display: swap;
      src: url(assets/fonts/space-grotesk-latin.woff2) format('woff2');
    }

    :root {
      /* Bright, friendly surfaces. Every text pair and every board feature was
         measured — see docs/DESIGN.md for the table. */
      --bg: #eef3ff;
      --surface: #ffffff;
      --surface-2: #f6f8ff;
      --line: #dce4f7;
      --ink: #182046;
      --ink-soft: #454f72;
      --ink-mute: #5f698a;
      --primary: #2f5fe0;      /* buttons and the active tab, 5.2:1 on white */
      --primary-soft: #e9efff;
      --good: #0f7b46;
      --good-soft: #e3f7ec;
      --bad: #b8232b;
      --bad-soft: #ffe9ea;
      --sun: #ffb01f;
      --grape: #6b4ff0;
      --sq-light: #f7e8c9;
      --sq-dark: #8fc177;
      --radius: 18px;
      --shadow: 0 2px 0 rgba(24, 32, 70, 0.08), 0 8px 24px rgba(24, 32, 70, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    html { background: var(--bg); }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }
    h1, h2, h3, .big { font-family: 'Space Grotesk', 'Inter', sans-serif; line-height: 1.2; }
    h1 { font-size: 21px; font-weight: 700; }
    h2 { font-size: 19px; font-weight: 700; }
    h3 { font-size: 16px; font-weight: 600; }
    p { color: var(--ink-soft); }
    a { color: var(--primary); }

    /* ---------- the app shell ---------- */
    .phone {
      max-width: 520px; margin: 0 auto; height: 100dvh; height: 100vh;
      display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden;
    }
    .appbar {
      display: flex; align-items: center; gap: 10px;
      padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    }
    .appbar .who { flex: 1; min-width: 0; }
    .appbar h1 { font-size: 19px; }
    .appbar p { font-size: 12.5px; color: var(--ink-mute); }
    main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 2px 16px 26px; }
    .screen[hidden] { display: none; }

    .tabbar {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--line);
    }
    .tab {
      border: 0; background: transparent; font: inherit; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 0 6px; border-radius: 14px; color: var(--ink-mute);
      font-size: 11.5px; font-weight: 600;
    }
    .tab svg { width: 24px; height: 24px; }
    .tab[aria-selected="true"] { color: var(--primary); background: var(--primary-soft); }
    .tab:active { transform: scale(0.96); }

    /* ---------- pieces of UI ---------- */
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow);
    }
    .stack { display: grid; gap: 12px; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .muted { color: var(--ink-mute); font-size: 13px; }
    .tiny { font-size: 12px; color: var(--ink-mute); }

    button.btn {
      font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
      border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
      padding: 12px 16px; border-radius: 14px; min-height: 48px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    button.btn:active { transform: scale(0.97); }
    button.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.btn.wide { width: 100%; }
    button.btn.icon { padding: 12px; min-width: 48px; }
    button.btn svg { width: 20px; height: 20px; }
    button.btn[disabled] { opacity: 0.45; }
    :focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
      padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    }
    .chip.good { background: var(--good-soft); border-color: #bfe8d3; color: var(--good); }
    .chip.bad { background: var(--bad-soft); border-color: #f7c9cc; color: var(--bad); }

    /* lesson list */
    .lesson {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 12px 14px; box-shadow: var(--shadow); font: inherit; color: var(--ink); cursor: pointer;
    }
    .lesson:active { transform: scale(0.99); }
    .lesson .num {
      width: 42px; height: 42px; flex: none; border-radius: 14px; background: var(--primary-soft);
      color: var(--primary); font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px;
      display: grid; place-items: center;
    }
    .lesson.done .num { background: #fff4dc; color: #8a5a00; }
    .lesson .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .lesson .txt .t { font-weight: 600; font-size: 15.5px; line-height: 1.25; text-wrap: balance; }
    .lesson .txt .s { font-size: 13px; color: var(--ink-mute); }
    .stars { display: flex; gap: 2px; }
    .stars svg { width: 15px; height: 15px; }

    /* board */
    .boardwrap { display: grid; gap: 10px; justify-items: center; }
    .board {
      width: 100%; max-width: 430px; aspect-ratio: 1; display: grid;
      grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
      border-radius: 18px; overflow: hidden; box-shadow: 0 6px 20px rgba(24, 32, 70, 0.18);
      user-select: none; touch-action: manipulation; border: 4px solid #fff;
    }
    .sq { position: relative; border: 0; padding: 0; background: var(--sq-light); display: grid; place-items: center; }
    .sq.dark { background: var(--sq-dark); }
    .sq.mine { cursor: pointer; }
    .sq .pc { font-size: min(10vw, 44px); line-height: 1; transition: transform 0.12s ease; }
    .sq .pc.w {
      color: #ffffff;
      -webkit-text-stroke: 1.4px #2c2f4a;
      text-shadow: 0 2px 0 rgba(44, 47, 74, 0.35), -1.5px -1.5px 0 #2c2f4a, 1.5px -1.5px 0 #2c2f4a, -1.5px 1.5px 0 #2c2f4a, 1.5px 1.5px 0 #2c2f4a;
    }
    .sq .pc.b {
      color: #262b45;
      -webkit-text-stroke: 1.4px #ffffff;
      text-shadow: 0 2px 0 rgba(24, 32, 70, 0.25), -1.5px -1.5px 0 #ffffff, 1.5px -1.5px 0 #ffffff, -1.5px 1.5px 0 #ffffff, 1.5px 1.5px 0 #ffffff;
    }
    /* Every state marker starts with a dark frame (#2c3350: 10.22:1 on cream,
       5.93:1 on green, so it is visible on both tones) and puts its meaning
       inside it. Nothing is signalled by a colour alone. */
    .sq.sel { box-shadow: inset 0 0 0 4px #2c3350, inset 0 0 0 9px #ffb01f; }
    .sq.sel .pc { transform: scale(1.12); }
    .sq.last { box-shadow: inset 0 0 0 4px rgba(44, 51, 80, 0.5); }
    .sq.hintbest { box-shadow: inset 0 0 0 4px #2c3350, inset 0 0 0 9px #0f7b46; }
    .sq.check { box-shadow: inset 0 0 0 4px #2c3350, inset 0 0 0 9px #e5484d; }
    .sq.right { box-shadow: inset 0 0 0 4px #2c3350, inset 0 0 0 9px #0f7b46, inset 0 0 0 100px rgba(15, 123, 70, 0.3); }
    .sq.wrong { box-shadow: inset 0 0 0 4px #2c3350, inset 0 0 0 9px #e5484d, inset 0 0 0 100px rgba(184, 35, 43, 0.16); }
    .sq .dot { width: 32%; height: 32%; border-radius: 50%; background: #2c3350; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9); }
    .sq .ring { position: absolute; inset: 4%; border: 6px solid #2c3350; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.9); }
    .sq .coord { position: absolute; font-size: 9.5px; font-weight: 700; color: #2c3350; }  /* 10.22:1 on cream, 5.93:1 on green */
    .sq .coord.f { right: 3px; bottom: 2px; }
    .sq .coord.r { left: 3px; top: 2px; }

    /* the coach and the puzzle feedback */
    .coach { display: flex; gap: 10px; align-items: flex-start; }
    .coach .av { flex: none; width: 36px; height: 36px; }
    .bubble {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px;
      padding: 12px 14px; font-size: 14.5px; color: var(--ink-soft); box-shadow: var(--shadow);
    }
    .bubble.good { background: var(--good-soft); border-color: #bfe8d3; }
    .bubble.bad { background: var(--bad-soft); border-color: #f7c9cc; }
    .bubble b { color: var(--ink); }

    /* lesson stepper */
    .dots { display: flex; gap: 6px; justify-content: center; margin: 4px 0 12px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: #c9d4ee; }
    .dots i.on { background: var(--primary); width: 20px; border-radius: 4px; }
    .dots i.win { background: var(--sun); }

    /* bottom sheet */
    /* The reward/message sheet. A scrim sits under it, full bleed, so nothing
       else is half-covered and the sheet is plainly the thing to act on. */
    .scrim { position: absolute; inset: 0; z-index: 20; background: rgba(24, 32, 70, 0.32); animation: fade 0.18s ease-out; }
    .scrim[hidden] { display: none; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 21;
      background: var(--surface); border-radius: 22px 22px 0 0;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 40px rgba(24, 32, 70, 0.28); animation: up 0.22s ease-out;
      max-height: 60%; overflow-y: auto;
    }
    .sheet[hidden] { display: none; }
    .sheet .sheethead { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
    .sheet .sheethead .bigicon { width: 44px; height: 44px; flex: none; }
    .sheet h2 { font-size: 20px; }
    @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 30; }
    .confetti i {
      position: absolute; top: -12px; width: 9px; height: 9px; border-radius: 2px;
      animation: fall 1.1s ease-in forwards;
    }
    @keyframes fall { to { transform: translateY(70vh) rotate(540deg); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    .sr {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }
  </style>
</head>
<body>
<div class="phone">
  <header class="appbar">
    <svg class="mascot" width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="21" r="13" fill="#fff" stroke="#2c2f4a" stroke-width="3.5"/>
      <path d="M20 56c0-11 5-17 12-17s12 6 12 17z" fill="#fff" stroke="#2c2f4a" stroke-width="3.5"/>
      <rect x="16" y="53" width="32" height="7" rx="3.5" fill="#fff" stroke="#2c2f4a" stroke-width="3"/>
      <circle cx="27" cy="20" r="2.4" fill="#2c2f4a"/>
      <circle cx="37" cy="20" r="2.4" fill="#2c2f4a"/>
      <path d="M27 26q5 4.5 10 0" fill="none" stroke="#2c2f4a" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <div class="who">
      <h1 id="app-title">Learn chess</h1>
      <p id="app-sub">Pick a lesson and play. Pip helps.</p>
    </div>
    <span class="chip" id="star-chip" title="Stars you have won">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z" fill="#ffb01f"/></svg>
      <span id="star-count">0</span>
    </span>
  </header>

  <main>
    <noscript>
      <div class="card"><p>This app plays chess, so it needs JavaScript turned on.</p></div>
    </noscript>

    <!-- LEARN -->
    <section class="screen" id="screen-learn" data-screen="learn">
      <div id="lesson-list" class="stack"></div>
      <div id="lesson-view" class="stack" hidden></div>
    </section>

    <!-- PLAY -->
    <section class="screen" id="screen-play" data-screen="play" hidden>
      <div class="stack">
        <div class="card" style="padding:12px 14px">
          <div class="between">
            <span class="chip" id="play-turn">Your move</span>
            <div class="row" style="gap:6px">
              <button class="btn icon" id="play-level" title="Choose how strong Pip plays" aria-label="Opponent strength">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 20l1-7h10l1 7M9 13l1-3h4l1 3M12 10V4m-3 0h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span id="play-level-label" style="font-size:13px">Level 2</span>
              </button>
              <button class="btn icon" id="play-new" title="Start a new game" aria-label="New game">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="boardwrap">
          <div class="board" id="play-board" role="grid" aria-label="Chess board"></div>
        </div>
        <div class="coach">
          <svg class="av" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="21" r="13" fill="#fff" stroke="#2c2f4a" stroke-width="3.5"/>
            <path d="M20 56c0-11 5-17 12-17s12 6 12 17z" fill="#fff" stroke="#2c2f4a" stroke-width="3.5"/>
            <circle cx="27" cy="20" r="2.4" fill="#2c2f4a"/><circle cx="37" cy="20" r="2.4" fill="#2c2f4a"/>
            <path d="M27 26q5 4.5 10 0" fill="none" stroke="#2c2f4a" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
          <div class="bubble" id="play-coach" aria-live="polite">Tap a piece, then tap where it should go.</div>
        </div>
        <div class="row" style="justify-content:center">
          <button class="btn" id="play-hint">Hint</button>
          <button class="btn" id="play-undo">Undo</button>
          <button class="btn" id="play-flip">Flip</button>
          <button class="btn" id="play-colour">Play black</button>
        </div>
        <p class="tiny" id="play-moves" style="text-align:center;word-spacing:4px"></p>
      </div>
    </section>

    <!-- TRAIN -->
    <section class="screen" id="screen-train" data-screen="train" hidden>
      <div class="stack">
        <div class="card">
          <div class="between">
            <span class="chip" id="train-streak-chip">
              <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c2 4 6 5 6 10a6 6 0 1 1-12 0c0-5 4-6 6-10z" fill="#ff7043"/></svg>
              <span>Streak <b id="train-streak">0</b></span>
            </span>
            <span class="chip"><span>Right <b id="train-solved">0</b>/<span id="train-total">0</span></span></span>
          </div>
          <p class="big" id="train-prompt" style="margin-top:12px;font-size:17px;font-weight:600"></p>
          <p class="tiny" id="train-where"></p>
        </div>
        <div class="boardwrap">
          <div class="board" id="train-board" role="grid" aria-label="Puzzle board"></div>
        </div>
        <div class="row" style="justify-content:center">
          <button class="btn" id="train-hint">Hint</button>
          <button class="btn" id="train-next">Next puzzle</button>
          <button class="btn" id="train-reset">Reset</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" aria-selected="true" aria-controls="screen-learn" data-target="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Lessons</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="screen-play" data-target="play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor"/></svg>
      <span>Play</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="screen-train" data-target="train">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
      <span>Puzzles</span>
    </button>
  </nav>

  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <p class="sr" id="live" aria-live="polite"></p>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
